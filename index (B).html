<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="XChat – Private Conversations. No Footprints.">
<title>XChat</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--mut:#8c8c8c;--line:#2a2a2a;--card:#0e0e0e;--card2:#181818;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
html[lang^="fa"] body,html[lang^="fa"] button,html[lang^="fa"] input,html[lang^="fa"] textarea{font-family:"Vazirmatn","Noto Sans Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.8}
button,input,textarea{font:inherit;color:inherit}
#bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top))}
body[data-view=chat] #bar{display:none}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;letter-spacing:.2px}
.lg{width:30px;height:30px;flex:none}
.lg.big{width:84px;height:84px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{background:none;border:0;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--mut);font-size:14px}
.seg button[aria-pressed=true]{background:#fff;color:#000;font-weight:600}
main{flex:1;display:flex;flex-direction:column}
.view{display:none;flex:1;width:100%;max-width:480px;margin:0 auto;padding:12px 20px 28px;flex-direction:column;gap:18px}
.view.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.center{justify-content:center;align-items:center;text-align:center}
h1{font-size:30px;letter-spacing:-.5px;line-height:1.2}
h2{font-size:22px;line-height:1.3}
p.mut,.mut{color:var(--mut)}
.small{font-size:13px}
.btn{display:block;width:100%;background:#fff;color:#000;border:0;border-radius:14px;padding:15px 20px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.btn.sm{padding:10px 16px;width:auto;display:inline-block}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;gap:8px;width:100%}
.field input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;direction:ltr;text-align:start}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);font-size:13px;text-align:start}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.opt{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.opt b{font-size:28px;line-height:1.1}
.opt span{color:var(--mut);font-size:13px}
.opt em{position:absolute;top:-9px;font-style:normal;font-size:11px;background:#fff;color:#000;border-radius:999px;padding:1px 8px;font-weight:600}
.opt[aria-checked=true]{background:#fff;color:#000;border-color:#fff}
.opt[aria-checked=true] span{color:#333}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.rows{display:flex;flex-direction:column;gap:8px;text-align:start;width:100%}
.rows div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.rows span:first-child{color:var(--mut)}
.rows span:last-child{text-align:end}
.foot{margin-top:auto;text-align:center;color:var(--mut);font-size:12px;padding-top:12px}
/* chat */
#v-chat{max-width:760px;padding:0;gap:0;height:100dvh}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.ch-head .brand b{font-size:16px}
.timer{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.timer small{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.timer output{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.timer.low output{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;color:#fff;padding:6px 10px;cursor:pointer;font-size:13px}
.hd-actions{display:flex;gap:6px;align-items:center}
#info{border-bottom:1px solid var(--line);padding:12px 16px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.hint{margin:auto;color:var(--mut);font-size:14px;text-align:center;max-width:280px}
.msg{max-width:80%;padding:9px 12px 6px;border-radius:18px;word-break:break-word;overflow-wrap:anywhere}
.msg .tx{white-space:pre-wrap}
.msg time{display:block;font-size:11px;opacity:.6;margin-top:2px;text-align:end}
.msg.mine{align-self:flex-end;background:#fff;color:#000;border-end-end-radius:6px}
.msg.theirs{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-end-start-radius:6px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:140px;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 16px;line-height:1.4}
.send{border:0;background:#fff;color:#000;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:18px;flex:none}
[dir=rtl] .send svg{transform:scaleX(-1)}
#offline{background:#fff;color:#000;text-align:center;font-size:13px;padding:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
#demoBar{position:fixed;left:6px;bottom:4px;z-index:8;font-size:11px;background:#fff;color:#000;border-radius:999px;padding:1px 10px;opacity:.85;pointer-events:none}
pre{white-space:pre-wrap;text-align:start;direction:ltr;font-size:13px}
</style>
</head>
<body data-view="loading">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 64 64">
  <rect x="3" y="3" width="58" height="46" rx="14" fill="#fff"/>
  <path d="M14 49 14 60 27 49z" fill="#fff"/>
  <path d="M23 15 41 37M41 15 23 37" stroke="#000" stroke-width="6.5" stroke-linecap="round"/>
</symbol></svg>

<div id="demoBar" hidden data-i18n="demo_bar"></div>
<header id="bar">
  <a class="brand" href="#" aria-label="XChat"><svg class="lg"><use href="#logo"/></svg><b>XChat</b></a>
  <div class="seg seglang" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="fa" lang="fa">دری</button></div>
</header>

<main>
  <section id="v-loading" class="view center"><div class="spin" role="status" aria-label="Loading"></div></section>

  <!-- Setup needed (English only, developer-facing) -->
  <section id="v-setup" class="view center">
    <svg class="lg big"><use href="#logo"/></svg>
    <h2>XChat needs a backend</h2>
    <p class="mut">The Firebase settings at the top of this file's script are empty, so real-time chat cannot work yet. Open <b>guide.html</b> and follow "Backend setup" (about 10 minutes, free plan).</p>
  </section>

  <!-- Screen 1: Welcome -->
  <section id="v-welcome" class="view center">
    <svg class="lg big"><use href="#logo"/></svg>
    <div><h1>XChat</h1><p class="mut" data-i18n="tagline" style="margin-top:6px"></p></div>
    <p data-i18n="welcome_desc"></p>
    <div class="stack">
      <button class="btn" id="goCreate" data-i18n="create_btn"></button>
      <button class="btn ghost" id="btnInstall" hidden data-i18n="install"></button>
    </div>
    <div class="stack" style="margin-top:6px">
      <p class="mut small" data-i18n="join_hint"></p>
      <form class="field" id="joinForm">
        <input id="joinInput" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="paste_ph">
        <button class="btn sm" type="submit" data-i18n="join_go"></button>
      </form>
    </div>
    <p class="note" data-i18n="notice_p1"></p>
    <div class="foot">Founded by WSL – 2026</div>
  </section>

  <!-- Screen 2: Create + invitation -->
  <section id="v-create" class="view">
    <div id="c-pick" class="stack" style="gap:18px">
      <h2 data-i18n="choose_duration"></h2>
      <div class="opts" role="radiogroup" id="opts"></div>
      <p class="mut small" data-i18n="duration_note"></p>
      <button class="btn" id="btnCreate" data-i18n="create_room"></button>
      <button class="btn ghost" id="btnBack1" data-i18n="home"></button>
    </div>
    <div id="c-invite" class="stack" style="gap:18px" hidden>
      <h2 data-i18n="invite_title"></h2>
      <p class="mut" data-i18n="invite_desc"></p>
      <div class="field"><input id="inviteLink" readonly></div>
      <button class="btn ghost" id="btnCopy" data-i18n="copy"></button>
      <a class="btn" id="btnWa" target="_blank" rel="noopener" data-i18n="wa"></a>
      <div class="card stack" style="align-items:center;text-align:center">
        <div class="spin" style="margin:0"></div>
        <p data-i18n="waiting"></p>
        <p class="mut small" id="inviteMeta"></p>
      </div>
      <button class="btn ghost" id="btnCloseRoom" data-i18n="close_room"></button>
    </div>
  </section>

  <!-- Screen 3: Join confirmation -->
  <section id="v-join" class="view center">
    <svg class="lg big"><use href="#logo"/></svg>
    <h2 data-i18n="join_title"></h2>
    <p id="joinDesc"></p>
    <div class="card rows" id="joinRows"></div>
    <button class="btn" id="btnJoin" data-i18n="join_conv"></button>
    <button class="btn ghost" id="btnBack2" data-i18n="home"></button>
  </section>

  <!-- Screen 4: Chat -->
  <section id="v-chat" class="view">
    <div id="offline" hidden data-i18n="offline"></div>
    <div class="ch-head">
      <a class="brand" href="#" onclick="return false" aria-label="XChat"><svg class="lg"><use href="#logo"/></svg><b>XChat</b></a>
      <div class="timer" id="timer"><small data-i18n="time_left"></small><output id="clock" aria-live="off">--:--</output></div>
      <div class="hd-actions">
        <button class="iconbtn" id="btnInfo" aria-expanded="false" aria-label="Info">ⓘ</button>
        <button class="iconbtn" id="btnClose" data-i18n="close_chat"></button>
      </div>
    </div>
    <div id="info" hidden>
      <div class="rows" id="infoRows"></div>
      <div class="seg seglang" role="group" aria-label="Language" style="align-self:flex-start"><button data-lang="en">English</button><button data-lang="fa" lang="fa">دری</button></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"><p class="hint" id="chatHint" data-i18n="chat_hint"></p></div>
    <div class="composer">
      <textarea id="msgInput" rows="1" maxlength="4000" data-i18n-ph="type_msg" aria-label="Message"></textarea>
      <button class="send" id="btnSend" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- Screen 5: Expired / closed -->
  <section id="v-expired" class="view center">
    <svg class="lg big"><use href="#logo"/></svg>
    <h2 id="endTitle"></h2>
    <p class="mut" id="endTime"></p>
    <button class="btn" id="btnNew" data-i18n="new_chat"></button>
    <p class="note" data-i18n="deletion_note"></p>
  </section>

  <!-- Errors -->
  <section id="v-error" class="view center">
    <svg class="lg big"><use href="#logo"/></svg>
    <h2 id="errText"></h2>
    <button class="btn" id="btnHome" data-i18n="home"></button>
  </section>
</main>
<div id="toast" role="status"></div>

<script type="module">
/* ============================================================
   XChat – Phase 1 (MVP): real-time text chat, two people,
   server-enforced expiry. NOT end-to-end encrypted yet.
   ============================================================ */

// >>> Paste your Firebase web-app config here (see guide.html → Backend setup)
const FIREBASE_CONFIG = {

  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: ""
};
const FB_VERSION = "10.14.1";
const INVITE_VALID_MS = 60 * 60 * 1000; // must match the database rules

/* ---------------- translations ---------------- */

    err_full: "This conversation already has two participants.",

    demo_bar: "LOCAL DEMO – same browser only, no server",

  },

    welcome_desc: "دو نفر. یک گفتگوی خصوصی. بدون حساب کاربری و بدون تاریخچه – وقتی زمان تمام شود، گفتگو ناپدید می‌شود.",

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let lang = "en";
try { lang = localStorage.getItem("xchat.lang") === "fa" ? "fa" : "en"; } catch {}
const t = (k, v = {}) => { let s = T[lang][k] ?? T.en[k] ?? k; for (const x in v) s = s.replace("{" + x + "}", v[x]); return s; };
const loc = () => lang === "fa" ? "fa-AF-u-ca-gregory" : "en";
const fmtTime = ms => new Intl.DateTimeFormat(loc(), { hour: "2-digit", minute: "2-digit" }).format(ms);

/* ---------------- routing ---------------- */
function teardown() {
  if (room) {
    room.ended = true;
    room.unsubMeta && room.unsubMeta();
    stopChat();
  }
  room = null;
}
async function route() {
  teardown();
  const gen = ++routeGen;
  const h = location.hash || "";
  let m;
  if ((m = h.match(/^#(?:j|r)-([A-Za-z0-9]{16,32})$/))) return openRoom(m[1], gen);
  if (h === "#new") { show("create"); $("#c-pick").hidden = false; $("#c-invite").hidden = true; return; }
  show("welcome");
}
function showError(key) { errKey = key; show("error"); renderError(); }

async function openRoom(id, gen) {
  show("loading");
  let user;
  try { user = await getUser(); await offsetReady; } catch (e) { console.error(e); return showError("err_generic"); }
  if (gen !== routeGen) return;
  room = { id, uid: user.uid, meta: null, ended: false, chat: null, wasMember: false };
  room.unsubMeta = onValue(ref(db, `rooms/${id}/meta`), snap => {
    if (gen !== routeGen || !room || room.ended) return;
    room.meta = snap.val();
    evaluate();
  }, err => { console.error(err); showError(err && err.code === "HOST_OFFLINE" ? "err_host" : "err_generic"); });
}

function statusOf(m) {
  if (!m) return "none";
  if (m.closed) return "closed";
  if (m.joinedAt) return now() >= m.joinedAt + m.duration * 60000 ? "expired" : "active";
  return now() > m.createdAt + INVITE_VALID_MS ? "lapsed" : "waiting";
}
const expiryOf = m => m.joinedAt + m.duration * 60000;

function evaluate() {
  const m = room.meta, uid = room.uid;
  if (!m) return showError("err_invalid");
  const role = m.creator === uid ? "creator" : m.guest === uid ? "guest" : null;
  const st = statusOf(m);
  if (role) {
    room.wasMember = true;
    if (st === "closed") return endSession("closed", m.closed);
    if (st === "expired") return endSession("expired", expiryOf(m));
    if (st === "lapsed") return endSession("invite", m.createdAt + INVITE_VALID_MS);
    if (st === "waiting") return showInvite();
    return startChat();
  }
  if (st === "closed") return showError("err_closed");
  if (st === "expired" || st === "lapsed") return showError("err_expired");
  if (st === "active" || m.guest) return showError("err_full");
  show("join"); renderJoin();
}

  const btn = e.currentTarget; btn.disabled = true;
  try {
    await update(ref(db), {
      [`rooms/${room.id}/meta/guest`]: room.uid,
      [`rooms/${room.id}/meta/joinedAt`]: serverTimestamp()
    });
    history.replaceState(null, "", "#r-" + room.id);
  } catch (err) { console.error(err); showError("err_full"); }
  btn.disabled = false;
});
$("#joinForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#joinInput").value.trim();
  const m = v.match(/#j-([A-Za-z0-9]{16,32})/) || v.match(/^([A-Za-z0-9]{32})$/);
  if (!m) return toast(t("err_link"));
  location.hash = "#j-" + m[1];
});

/* ---------------- chat ---------------- */
const msgEls = new Map();
function startChat() {
  if (room.chat) return;
  const m = room.meta;
  show("chat");
  const exp = expiryOf(m);
  const mref = ref(db, `rooms/${room.id}/messages`);
  room.chat = { exp, mref, un: [], tick: null };
  room.chat.un.push(onChildAdded(mref, s => addMsg(s.key, s.val()), e => console.warn("messages listener", e.code)));
  room.chat.un.push(onChildChanged(mref, s => addMsg(s.key, s.val())));
  room.chat.tick = setInterval(tick, 250);
  tick(); renderInfo();
  setTimeout(() => $("#msgInput").focus(), 100);
}
function tick() {
  if (!room || !room.chat) return;
  const left = room.chat.exp - now();
  if (left <= 0) return endSession("expired", room.chat.exp);
  const s = Math.ceil(left / 1000);
  $("#clock").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  $("#timer").classList.toggle("low", s <= 60);
}
function stopChat() {
  if (room && room.chat) {
    clearInterval(room.chat.tick);
    room.chat.un.forEach(u => { try { u(); } catch {} });
    room.chat = null;
  }
  msgEls.forEach(el => el.remove()); msgEls.clear();
  const h = $("#chatHint"); if (h) h.hidden = false;
  const i = $("#msgInput"); if (i) { i.value = ""; i.style.height = "auto"; }
}
function addMsg(key, v) {
  if (!room || !v || typeof v.text !== "string") return;
  let el = msgEls.get(key);
  const box = $("#msgs");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (!el) {
    el = document.createElement("div");
    el.className = "msg " + (v.uid === room.uid ? "mine" : "theirs");
    el.innerHTML = '<div class="tx"></div><time></time>';
    el.querySelector(".tx").textContent = v.text; // textContent only: no HTML injection
    box.appendChild(el); msgEls.set(key, el);
    $("#chatHint").hidden = true;
  }
  const tm = el.querySelector("time");
  if (typeof v.ts === "number") { tm.dataset.ts = v.ts; tm.textContent = fmtTime(v.ts); tm.title = fmtFull(v.ts); }
  if (nearBottom || v.uid === room.uid) box.scrollTop = box.scrollHeight;
}
function renderMsgTimes() {
  $$("#msgs time").forEach(tm => { if (tm.dataset.ts) { tm.textContent = fmtTime(+tm.dataset.ts); tm.title = fmtFull(+tm.dataset.ts); } });
}
let lastSend = 0;
async function send() {
  const inp = $("#msgInput"); const txt = inp.value.trim();
  if (!txt || !room || !room.chat) return;
  if (Date.now() - lastSend < 400) return; // basic client-side throttle
  lastSend = Date.now();
  inp.value = ""; inp.style.height = "auto";
  try { await push(room.chat.mref, { uid: room.uid, text: txt, ts: serverTimestamp() }); }
  catch (e) { console.warn(e); toast(t("err_send")); inp.value = txt; }
}
$("#btnSend").addEventListener("click", send);
$("#msgInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#msgInput").addEventListener("input", e => { const i = e.target; i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 140) + "px"; });
$("#btnInfo").addEventListener("click", () => {
  const info = $("#info"); info.hidden = !info.hidden;
  $("#btnInfo").setAttribute("aria-expanded", !info.hidden);
});
function renderInfo() {
  if (!room || !room.meta || !room.meta.joinedAt) return;
  const m = room.meta;
  const rows = [
    [t("i_len"), t("minutes", { n: num(m.duration) })],
    [t("i_created"), fmtFull(m.createdAt)],
    [t("i_joined"), fmtFull(m.joinedAt)],
    [t("i_started"), fmtFull(m.joinedAt)],
    [t("i_ends"), fmtFull(expiryOf(m))],
    [t("i_tz"), tzName()]
  ];
  const box = $("#infoRows"); box.innerHTML = "";
  rows.forEach(([a, b]) => { const d = document.createElement("div"); d.innerHTML = "<span></span><span></span>"; d.children[0].textContent = a; d.children[1].textContent = b; box.appendChild(d); });
}

/* ---------------- end of session ---------------- */
function endSession(kind, ms) {
  if (!room || room.ended) return;
  const id = room.id;
  room.ended = true;
  room.unsubMeta && room.unsubMeta();
  stopChat();
  // Best-effort secure deletion: remove every message from the server.
  // (Database rules only allow this once the session is over.)
  remove(ref(db, `rooms/${id}/messages`)).catch(() => {});
  endInfo = { kind, ms: ms || now() };
  show("expired"); renderExpired();
}
function renderExpired() {
  if (!endInfo) return;
  $("#endTitle").textContent = endInfo.kind === "closed" ? t("closed") : endInfo.kind === "invite" ? t("invite_expired") : t("expired");
  $("#endTime").textContent = t("ended_at") + ": " + fmtFull(endInfo.ms);
}
function renderError() { $("#errText").textContent = t(errKey); }

/* ---------------- buttons ---------------- */
$("#goCreate").addEventListener("click", () => { location.hash = "#new"; });
["#btnBack1", "#btnBack2", "#btnHome", "#btnNew"].forEach(s => $(s).addEventListener("click", () => {
  if (s === "#btnNew") { if (location.hash === "#new") route(); else location.hash = "#new"; }
  else { if (!location.hash) route(); else location.hash = ""; }
}));

/* ---------------- PWA (installable on Android) ---------------- */
function setupPWA() {
  try {
    const icon = s => {
      const c = document.createElement("canvas"); c.width = c.height = s; const x = c.getContext("2d");
      x.fillStyle = "#000"; x.fillRect(0, 0, s, s);
      const p = s * .17, w = s - 2 * p, h = w * .76;
      x.fillStyle = "#fff"; x.beginPath(); x.roundRect ? x.roundRect(p, p, w, h, s * .14) : x.rect(p, p, w, h); x.fill();
      x.beginPath(); x.moveTo(p + w * .12, p + h - 2); x.lineTo(p + w * .12, p + h + s * .13); x.lineTo(p + w * .36, p + h - 2); x.fill();
      const cx = s / 2, cy = p + h / 2, d = s * .12;
      x.strokeStyle = "#000"; x.lineWidth = s * .07; x.lineCap = "round";
      x.beginPath(); x.moveTo(cx - d, cy - d); x.lineTo(cx + d, cy + d); x.moveTo(cx + d, cy - d); x.lineTo(cx - d, cy + d); x.stroke();
      return c.toDataURL("image/png");
    };
    const i192 = icon(192), i512 = icon(512);
    const base = location.origin + location.pathname;
    const man = { name: "XChat", short_name: "XChat", description: "XChat – Private Conversations. No Footprints.", start_url: base, scope: base.replace(/[^/]*$/, ""), display: "standalone", background_color: "#000000", theme_color: "#000000", icons: [{ src: i192, sizes: "192x192", type: "image/png", purpose: "any" }, { src: i512, sizes: "512x512", type: "image/png", purpose: "any" }] };
    const l = document.createElement("link"); l.rel = "manifest"; l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
    const a = document.createElement("link"); a.rel = "apple-touch-icon"; a.href = i192; document.head.appendChild(a);
  } catch (e) { console.warn("PWA setup skipped", e); }
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; $("#btnInstall").hidden = false; });
$("#btnInstall").addEventListener("click", async () => { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; $("#btnInstall").hidden = true; } });

/* ---------------- boot ---------------- */
document.body.dataset.view = "loading";
renderers = [renderOpts, renderInvite, renderJoin, renderInfo, renderExpired, renderError, renderMsgTimes];
buildOpts();
setLang(lang);
setupPWA();
(async () => {
  try { if (CONFIGURED) await loadFirebase(); else { try { await loadP2P(); } catch (e) { console.warn("Direct mode unavailable, using local demo", e); loadDemo(); } } } catch (e) { console.error(e); return showError("err_generic"); }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
